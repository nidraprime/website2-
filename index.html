<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NidraPrime Mattress — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal-dark:   #0d2b27;
      --teal-mid:    #1a4a3a;
      --teal-light:  #2a6b52;
      --teal-bright: #3a8a68;
      --gold:        #c8956a;
      --gold-light:  #e0b48a;
      --gold-pale:   #f0d0b0;
      --white:       #f5f2ee;
      --white-dim:   rgba(245,242,238,0.75);
      --white-faint: rgba(245,242,238,0.45);
      --badge-border: rgba(200,149,106,0.5);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
    }

    /* ── BACKGROUND ── */
    .bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 70% at 50% 20%, #2d6b50 0%, transparent 60%),
        radial-gradient(ellipse 70% 90% at 80% 80%, #0e3028 0%, transparent 55%),
        radial-gradient(ellipse 60% 60% at 20% 70%, #113322 0%, transparent 50%),
        linear-gradient(160deg, #1c4a38 0%, #0d2b24 45%, #081e18 100%);
      z-index: 0;
    }

    /* Subtle arc lines like in the reference */
    .bg-arcs {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }
    .bg-arcs svg {
      position: absolute;
      width: 100%; height: 100%;
      opacity: 0.07;
    }

    /* Grain */
    .grain {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.04;
    }

    /* ── STAGE ── */
    .stage {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }

    /* ── BADGE ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--badge-border);
      padding: 9px 22px;
      margin-bottom: 52px;
      opacity: 0;
      animation: rise 1.2s cubic-bezier(0.22,1,0.36,1) 0.2s forwards;
    }
    .badge-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 6px 2px rgba(200,149,106,0.5);
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.6; transform: scale(0.8); }
    }
    .badge-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.3em;
      color: var(--gold-light);
      text-transform: uppercase;
    }
    .badge-sep {
      color: var(--gold-light);
      opacity: 0.5;
      font-size: 10px;
      letter-spacing: 0.1em;
    }

    /* ── LAYERS ICON ── */
    .layers-icon {
      margin-bottom: 32px;
      opacity: 0;
      animation: rise 1.4s cubic-bezier(0.22,1,0.36,1) 0.5s forwards;
    }

    /* ── WORDMARK ── */
    .wordmark {
      opacity: 0;
      animation: rise 1.4s cubic-bezier(0.22,1,0.36,1) 0.8s forwards;
      margin-bottom: 10px;
    }
    .wordmark-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      line-height: 1;
    }
    .wm-nidra {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: clamp(42px, 9vw, 108px);
      letter-spacing: 0.04em;
      color: var(--gold);
      text-transform: uppercase;
    }
    .wm-prime {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: clamp(42px, 9vw, 108px);
      letter-spacing: 0.04em;
      color: var(--gold-light);
      text-transform: uppercase;
    }
    .wm-sub {
      font-family: 'Montserrat', sans-serif;
      font-weight: 400;
      font-size: clamp(10px, 1.5vw, 13px);
      letter-spacing: 0.45em;
      color: var(--white-faint);
      text-transform: uppercase;
      margin-top: 6px;
      padding-left: 0.45em;
    }

    /* ── DIVIDER ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 36px 0 30px;
      opacity: 0;
      animation: rise 1.2s cubic-bezier(0.22,1,0.36,1) 1.2s forwards;
    }
    .div-line {
      width: clamp(50px, 8vw, 100px);
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(200,149,106,0.35));
    }
    .div-line.r { background: linear-gradient(to left, transparent, rgba(200,149,106,0.35)); }
    .div-diamond {
      width: 8px; height: 8px;
      background: var(--gold);
      transform: rotate(45deg);
      opacity: 0.9;
    }

    /* ── TAGLINE ── */
    .tagline {
      font-family: 'Playfair Display', serif;
      font-size: clamp(20px, 3.5vw, 40px);
      font-weight: 400;
      color: var(--white);
      line-height: 1.4;
      max-width: 640px;
      opacity: 0;
      animation: rise 1.4s cubic-bezier(0.22,1,0.36,1) 1.5s forwards;
    }
    .tagline em {
      font-style: italic;
      color: var(--gold-light);
    }

    /* ── COMING SOON ── */
    .coming-soon {
      margin-top: 48px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      font-size: 10px;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--white-faint);
      padding-left: 0.5em;
      opacity: 0;
      animation: rise 1.2s cubic-bezier(0.22,1,0.36,1) 1.9s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* bottom edge glow */
    .bottom-glow {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(to right, transparent 10%, rgba(200,149,106,0.3) 40%, rgba(200,149,106,0.5) 50%, rgba(200,149,106,0.3) 60%, transparent 90%);
      z-index: 20;
      opacity: 0;
      animation: rise 2s ease 2.2s forwards;
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <!-- Decorative arc lines -->
  <div class="bg-arcs">
    <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="720" cy="450" rx="600" ry="420" stroke="#c8956a" stroke-width="0.8"/>
      <ellipse cx="720" cy="450" rx="480" ry="340" stroke="#c8956a" stroke-width="0.6"/>
      <ellipse cx="720" cy="450" rx="360" ry="260" stroke="#c8956a" stroke-width="0.5"/>
      <line x1="120" y1="450" x2="1320" y2="450" stroke="#c8956a" stroke-width="0.4"/>
      <line x1="720" y1="30" x2="720" y2="870" stroke="#c8956a" stroke-width="0.4"/>
    </svg>
  </div>

  <div class="grain"></div>

  <div class="stage">

    <!-- Badge -->
    <div class="badge">
      <div class="badge-dot"></div>
      <span class="badge-text">Now Launching</span>
      <span class="badge-sep">·</span>
      <span class="badge-text">India</span>
    </div>

    <!-- Stacked layers icon -->
    <div class="layers-icon">
      <svg width="60" height="38" viewBox="0 0 60 38" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- layer 3 (bottom) -->
        <ellipse cx="30" cy="32" rx="22" ry="5.5" fill="none" stroke="#c8956a" stroke-width="1" opacity="0.4"/>
        <path d="M8 32 L30 26 L52 32" fill="none" stroke="#c8956a" stroke-width="1" opacity="0.4"/>
        <!-- layer 2 -->
        <ellipse cx="30" cy="22" rx="22" ry="5.5" fill="#1a4a3a" stroke="#c8956a" stroke-width="1" opacity="0.65"/>
        <path d="M8 22 L30 16 L52 22" fill="#1a4a3a" stroke="#c8956a" stroke-width="1" opacity="0.65"/>
        <!-- layer 1 (top) -->
        <ellipse cx="30" cy="12" rx="22" ry="5.5" fill="#1e5540" stroke="#c8956a" stroke-width="1.2" opacity="0.9"/>
        <path d="M8 12 L30 6 L52 12" fill="#1e5540" stroke="#c8956a" stroke-width="1.2" opacity="0.9"/>
        <!-- top surface highlight -->
        <ellipse cx="30" cy="6.5" rx="18" ry="4" fill="none" stroke="#e0b48a" stroke-width="0.7" opacity="0.5"/>
      </svg>
    </div>

    <!-- Wordmark -->
    <div class="wordmark">
      <div class="wordmark-row">
        <span class="wm-nidra">Nidra</span><span class="wm-prime">Prime</span>
      </div>
      <div class="wm-sub">Mattress</div>
    </div>

    <!-- Divider -->
    <div class="divider">
      <div class="div-line"></div>
      <div class="div-diamond"></div>
      <div class="div-line r"></div>
    </div>

    <!-- Tagline -->
    <p class="tagline">
      The sleep you were always<br>
      <em>meant to have</em> — is finally here.
    </p>

    <!-- Coming Soon -->
    <p class="coming-soon">Coming Soon</p>

  </div>

  <div class="bottom-glow"></div>

</body>
</html>
